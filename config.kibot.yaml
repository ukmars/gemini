kibot:
  version: 1

kicad: 8

preflight:
  check_zone_fills: false

variants: []

outputs:
  # 1) Schematic PDF
  - name: pdf_schematic
    type: pdf_sch_print
    dir: docs
    options:
      monochrome: false
      output: "%p_schematic.pdf"

  # 2) CSV BoM
  - name: bom_csv
    type: bom
    dir: docs
    options:
      format: CSV
      group_fields: ["Manufacturer", "MPN", "Value", "Footprint"]
      ref_separator: " "
      output: "%p_bom.csv"

  # 3) PCB render - top
  - name: pcbdraw_top
    type: pcbdraw
    dir: docs
    options:
      format: png
      dpi: 300
      bottom: false
      output: "%p_board_top.png"

  # 4) PCB render - bottom (mirrored automatically by pcbdraw)
  - name: pcbdraw_bottom
    type: pcbdraw
    dir: docs
    options:
      format: png
      dpi: 300
      bottom: true
      output: "%p_board_bottom.png"
