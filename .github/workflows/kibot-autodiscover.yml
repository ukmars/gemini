name: KiCad docs via KiBot (auto-discover)

on:
  push:
    paths:
      - "**/*.kicad_pro"
      - "**/*.kicad_sch"
      - "**/*.kicad_pcb"
      - "config.kibot.yaml"
      - ".github/workflows/kibot-autodiscover.yml"
  pull_request:
    paths:
      - "**/*.kicad_pro"
      - "**/*.kicad_sch"
      - "**/*.kicad_pcb"
      - "config.kibot.yaml"
  workflow_dispatch:

concurrency:
  group: kibot-${{ github.ref }}
  cancel-in-progress: true

# allow committing to the repo's docs/ folder
permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - id: mk
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # 1) Collect all .kicad_pro files (git first, fall back to find)
          if git ls-files '*.kicad_pro' >/dev/null 2>&1; then
            mapfile -t PROJ < <(git ls-files '*.kicad_pro' | sort)
          else
            mapfile -d '' -t PROJ < <(find . -type f -name '*.kicad_pro' -print0 | sed -z 's|^\./||' | sort -z)
          fi

          echo "Found ${#PROJ[@]} KiCad projects:" >> "$GITHUB_STEP_SUMMARY"
          for p in "${PROJ[@]}"; do echo "- $p" >> "$GITHUB_STEP_SUMMARY"; done

          # 2) Build newline-delimited JSON objects safely with jq
          : > rows.jsonl
          for p in "${PROJ[@]}"; do
            dir="$(dirname "$p")"
            base="$(basename "$p" .kicad_pro)"

            sch="${dir}/${base}.kicad_sch"
            pcb="${dir}/${base}.kicad_pcb"

            # Fallbacks if names don't match project base
            [[ -f "$sch" ]] || sch="$(find "$dir" -maxdepth 1 -name '*.kicad_sch' | sort | head -n1 || true)"
            [[ -f "$pcb" ]] || pcb="$(find "$dir" -maxdepth 1 -name '*.kicad_pcb' | sort | head -n1 || true)"

            if [[ -f "${sch:-}" && -f "${pcb:-}" ]]; then
              jq -n --arg project "$p" --arg schema "$sch" --arg board "$pcb" \
                '{project:$project, schema:$schema, board:$board}' >> rows.jsonl
            else
              echo "⚠️ Skipping '$p' (missing SCH or PCB). sch='${sch:-none}', pcb='${pcb:-none}'" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # 3) Compact one-line JSON array for the matrix
          matrix_json="$(jq -c -s '.' rows.jsonl)"

          # 4) Write a SINGLE-LINE output (no extra spaces/newlines)
          printf 'matrix=%s\n' "$matrix_json" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' && needs.discover.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # serialize so commits to docs/ don't race
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - name: Run KiBot (KiCad 8)
        uses: INTI-CMNB/KiBot@v2_k8
        with:
          config: config.kibot.yaml
          dir: build/${{ matrix.project }}
          schema: ${{ matrix.schema }}
          board:  ${{ matrix.board }}

      - name: Copy outputs into repo docs/<ProjectName>/
        shell: bash
        run: |
          set -euo pipefail
          pname="$(basename '${{ matrix.project }}' .kicad_pro)"
          src="build/${{ matrix.project }}/docs/${pname}"
          dest="docs/${pname}"
          if [ -d "$src" ]; then
            mkdir -p "$dest"
            rsync -a --delete "$src/" "$dest/"
            echo "Copied to $dest"
            ls -la "$dest"
          else
            echo "ERROR: Expected source folder '$src' not found"
            exit 1
          fi

      - name: Commit updated docs (only on push)
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "docs: update ${{ matrix.project }} [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
